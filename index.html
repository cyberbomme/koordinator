<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koordinator</title>
  <meta name="description" content="Geo-Koordinaten live umrechnen: Dezimalgrad, Grad/Minuten/Sekunden, Plus Code, UTM, MGRS, Gauß-Krüger, Geohash, Maidenhead.">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Theme vor dem ersten Rendern setzen, um Flackern zu vermeiden
    try {
      var t = JSON.parse(localStorage.getItem('koordinator.settings') || '{}').theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-logo"/></svg>
      <div>
        <h1>Koordinator</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </div>
    <nav class="actions">
      <button type="button" class="btn" id="btn-locate"><svg aria-hidden="true"><use href="#i-locate"/></svg><span data-i18n="locate"></span></button>
      <button type="button" class="btn" id="btn-share" disabled><svg aria-hidden="true"><use href="#i-share"/></svg><span data-i18n="share"></span></button>
      <button type="button" class="btn icon-only" id="btn-settings" data-i18n-aria="settings"><svg aria-hidden="true"><use href="#i-gear"/></svg></button>
    </nav>
  </header>

  <main class="layout" id="layout">
    <section class="fields" id="fields" aria-live="off"></section>
    <aside class="mapcol" id="mapcol">
      <div class="mapcard">
        <div id="map" role="application" data-i18n-aria="mapLabel"></div>
        <div class="maplinks" id="maplinks">
          <span data-i18n="openIn"></span>
          <a id="link-gmaps" target="_blank" rel="noopener">Google Maps</a>
          <a id="link-osm" target="_blank" rel="noopener">OpenStreetMap</a>
          <a id="link-apple" target="_blank" rel="noopener">Apple Maps</a>
        </div>
      </div>
      <p class="hint" data-i18n="mapHint"></p>
    </aside>
  </main>

  <footer class="footer">
    <p data-i18n="footerLocal"></p>
    <p><a href="https://github.com/cyberbomme/koordinator" target="_blank" rel="noopener">GitHub</a> · <span data-i18n="footerMap"></span></p>
  </footer>

  <dialog id="settings" class="dialog">
    <form method="dialog" class="dialog-inner">
      <header class="dialog-head">
        <h2 data-i18n="settings"></h2>
        <button type="submit" class="btn icon-only ghost" data-i18n-aria="close"><svg aria-hidden="true"><use href="#i-close"/></svg></button>
      </header>

      <fieldset>
        <legend data-i18n="language"></legend>
        <div class="segmented">
          <label><input type="radio" name="lang" value="de"><span>Deutsch</span></label>
          <label><input type="radio" name="lang" value="en"><span>English</span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="theme"></legend>
        <div class="segmented">
          <label><input type="radio" name="theme" value="auto"><span data-i18n="themeAuto"></span></label>
          <label><input type="radio" name="theme" value="light"><span data-i18n="themeLight"></span></label>
          <label><input type="radio" name="theme" value="dark"><span data-i18n="themeDark"></span></label>
        </div>
      </fieldset>

      <fieldset>
        <legend data-i18n="display"></legend>
        <label class="check"><input type="checkbox" id="opt-map"><span data-i18n="showMap"></span></label>
      </fieldset>

      <fieldset>
        <legend data-i18n="formatsStandard"></legend>
        <div class="checks" id="checks-standard"></div>
      </fieldset>

      <details class="advanced" id="advanced">
        <summary data-i18n="formatsAdvanced"></summary>
        <div class="checks" id="checks-advanced"></div>
      </details>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 32 32"><circle cx="16" cy="16" r="10.5" fill="none" stroke="currentColor" stroke-width="2.5"/><circle cx="16" cy="16" r="3.5" fill="currentColor"/><path d="M16 1.5v6M16 24.5v6M1.5 16h6M24.5 16h6" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M8 8l8 8M16 8l-8 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  </svg>

  <script src="vendor/proj4.js"></script>
  <script src="vendor/mgrs.js"></script>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/convert.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
